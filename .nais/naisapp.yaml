apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: team-arbeidsforhold-statistikk
  namespace: arbeidsforhold
  labels:
    team: arbeidsforhold
spec:
  leaderElection: true
  port: 8080
  replicas:
    max: 2
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
  uses:
    postgres:
      - name: team-arbeidsforhold-statistikk-db
  envFrom:
    - secret: github-app
  azure:
    application:
      enabled: true
      allowAllUsers: false
    sidecar:
      enabled: true
      autoLogin: true
  accessPolicy:
    inbound:
      rules:
        - application: azure-token-generator
          namespace: nais
    outbound:
      external:
        - host: api.github.com
        - host: nvd.nist.gov
        - host: console.nav.cloud.nais.io
