name: Build and deploy
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for what-changed action
      - uses: nais/setup@v1
        with:
          team: arbeidsforhold
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Bygg java
        run: mvn package
        env:
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Determine what to do
        id: changed-files
        uses: "nais/what-changed@main"
        with:
          files: "README.md,LICENSE,LICENSE.md,CODEOWNERS,.gitignore"
      - name: Build and push main image and SBOM to OCI registry
        if: steps.changed-files.outputs.changed != 'only-inputs'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: arbeidsforhold
          dockerfile: src/main/docker/Dockerfile
      - name: Deploy postgresql config to prod
        run: nais apply .nais/postgres.yaml --environment prod-gcp --wait
      - name: Deploy app to prod
        if: ${{ steps.docker-build-push.outputs.image }}
        run: nais apply .nais/naisapp.yaml --environment prod-gcp --set spec.image="${{steps.docker-build-push.outputs.image}}" --wait
      - name: Deploy new manifest to prod
        if: ${{ !steps.docker-build-push.outputs.image }}
        run: nais apply .nais/naisapp.yaml --environment prod-gcp --wait
