databaseChangeLog:
  - changeSet:
      id: 006
      author: arbeidsforhold
      changes:
        - createTable:
            tableName: deployment_vulnerability
            columns:
              - column:
                  name: workload_name
                  type: VARCHAR(250)
                  constraints:
                    primaryKey: true
              - column:
                  name: suffix
                  type: VARCHAR(2)
                  constraints:
                    primaryKey: true
              - column:
                  name: environment
                  type: VARCHAR(20)
                  constraints:
                    primaryKey: true
              - column:
                  name: vulnerability_id
                  type: VARCHAR(250)
                  constraints:
                    primaryKey: true

        - addForeignKeyConstraint:
            baseTableName: deployment_vulnerability
            baseColumnNames: vulnerability_id
            referencedTableName: vulnerability
            referencedColumnNames: id
            constraintName: fk_deployment_vulnerability_vulnerability

        - addForeignKeyConstraint:
            baseTableName: deployment_vulnerability
            baseColumnNames: workload_name, suffix, environment
            referencedTableName: deployment
            referencedColumnNames: workload_name, suffix, environment
            constraintName: fk_deployment_vulnerability_deployment
