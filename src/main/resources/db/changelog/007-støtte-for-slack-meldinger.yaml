databaseChangeLog:
  - changeSet:
      id: 007
      author: arbeidsforhold
      changes:
        - createTable:
            tableName: critical_vulnerability_notice
            columns:
              - column:
                  name: vulnerability_id
                  type: VARCHAR(250)
                  constraints:
                    primaryKey: true
              - column:
                  name: first_noticed
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: VARCHAR(250)
                  constraints:
                    primaryKey: true
                    checkConstraint: channel IN ('slack')
              - column:
                  name: when_sent
                  type: timestamp
              - column:
                  name: who_sent
                  type: VARCHAR(250)

        - addForeignKeyConstraint:
            baseTableName: critical_vulnerability_notice
            baseColumnNames: vulnerability_id
            referencedTableName: vulnerability
            referencedColumnNames: id
            constraintName: fk_critical_vulnerability_notice_vulnerability
